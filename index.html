  <script>
  // =============================================================
  //  ⚙️  설정 — 구글 시트 CSV URL을 여기에 붙여넣으세요
  //  예) 'https://docs.google.com/spreadsheets/d/.../pub?gid=0&single=true&output=csv'
  // =============================================================
  const CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJYO14r7y4-8SgUtFs7JWQKtL-Ijd6WP_wMPKiYGbs8r7utQ3AsJ0dgBeiROVIIw/pub?gid=680677374&single=true&output=csv';
  const PASSWORD = '1128';

  // =============================================================
  //  컬럼 인덱스 (통장 내역 기준)
  //  거래일시(0) 출금(1) 입금(2) 거래후잔액(3) 거래내용(4)
  //  상대계좌번호(5) 상대은행(6) 메모(7) 거래구분(8)
  //  수표어음금액(9) CMS코드(10) 상대계좌예금주명(11)
  // =============================================================
  // 기본값 — parseCSV 내부에서 헤더 기반으로 자동 업데이트됨
  let C = {
    DT   : 0,  // 거래일시
    OUT  : 1,  // 출금
    IN   : 2,  // 입금
    BAL  : 3,  // 거래후잔액
    DESC : 4,  // 거래내용
    ACNO : 5,  // 상대계좌번호
    BANK : 6,  // 상대은행
    MEMO : 7,  // 메모
    TYPE : 8,  // 거래구분
    CHK  : 9,  // 수표어음금액
    CMS  :10,  // CMS코드
    NAME :11,  // 상대계좌예금주명
  };

  // =============================================================
  //  분류 패턴
  // =============================================================
  const RE = {
    // 매출 — 카드사 (카드사명+숫자 or 숫자+BC 패턴 포함)
    CARD_ANY  : /BC|우리카드|우리[0-9]|현대카드|현대[0-9]|SHC|신한카드|신한[0-9]|롯데카드|롯데[0-9]|하나카드|하나[0-9]|삼성카드|삼성[0-9]|KB카드|국민카드|KB[0-9]|농협카드|농협[0-9]|우체국카드/i,

    // 매출 — 플랫폼
    PLATFORM  : /Npay|네이버페이|네이버\s*파이낸셜|토스|Toss|카카오페이/i,

    // 매출 — 이체매출 (2~4글자 순수 한글 이름 = 현금매출)
    KR_NAME   : /^[가-힣]{2,4}$/,

    // 지출 — 고정비 (이진호 = 임대료/관리비/전기세 포함)
    FIXED     : /이진호/,

    // 지출 — 인건비
    SALARY    : /월급|급여|알바비|알바/,

    // 지출 — 세금
    TAX       : /국세|지방세|부가세|소득세|법인세|종합소득세|원천세|세금|세무서/,

    // 지출 — 운영비
    OPS       : /쿠팡|오늘의집|GS25|CU편의점|CU마트|회계법인|중앙피앤씨/,

    // 지출 — 교통비
    TRANS     : /택시|카카오T|카카오택시|우버|Uber/i,

    // 지출 — 통신비
    TELECOM   : /통신요금|통신비|SKT|LGU\+|LG유플|이동통신/,

    // 지출 — 식비/회식비 (음식점 이름 키워드)
    FOOD      : /버거킹|맥도날드|롯데리아|KFC|파파이스|서브웨이|피자헛|도미노피자|피자|치킨|삼겹살|냉면|칼국수|김밥|분식|카페|커피|스타벅스|투썸|이디야|파리바게|뚜레쥬르|할리스|탐앤탐|메가커피|마라탕|떡볶이|순대|포차|주점|술집|식당|음식점|횟집|초밥|스시|라멘|우동|곱창|닭갈비|삼계탕|돈까스|쌀국수|한식당|중식당|일식당|양식당|뷔페|우아한형제들|배달의민족|배민/,

    // 예외 — 가승인·취소
    CANCEL    : /가승인|취소/,
  };

  // 카드사 식별 함수
  function identifyCardCompany(desc) {
    if (/[0-9]BC\b|\bBC[0-9]|\bBC\b/i.test(desc)) return 'BC카드';
    if (/우리카드|우리[0-9]/i.test(desc)) return '우리카드';
    if (/현대카드|현대[0-9]/i.test(desc)) return '현대카드';
    if (/SHC|신한카드|신한[0-9]/i.test(desc)) return '신한카드';
    if (/롯데카드|롯데[0-9]/i.test(desc)) return '롯데카드';
    if (/하나카드|하나[0-9]/i.test(desc)) return '하나카드';
    if (/삼성카드|삼성[0-9]/i.test(desc)) return '삼성카드';
    if (/KB카드|국민카드|KB[0-9]/i.test(desc)) return 'KB카드';
    if (/농협카드|농협[0-9]/i.test(desc)) return '농협카드';
    if (/우체국카드/i.test(desc)) return '우체국카드';
    return '기타카드';
  }

  // =============================================================
  //  유틸리티
  // =============================================================
  function parseAmount(s) {
    if (!s) return 0;
    const n = parseFloat(String(s).replace(/[,\s원]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function parseDT(s) {
    if (!s) return null;
    s = String(s).trim();
    let m;

    // "2024. 1. 15. 오전 2:30:00" or "오후" (Google Sheets 한국어 날짜)
    m = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.?\s*(오전|오후)?\s*(\d{1,2}):(\d{2})/);
    if (m) {
      let h = parseInt(m[5]);
      if (m[4] === '오후' && h !== 12) h += 12;
      if (m[4] === '오전' && h === 12) h = 0;
      return new Date(+m[1], +m[2]-1, +m[3], h, +m[6]);
    }
    // "2024. 1. 15." or "2024. 1. 15"
    m = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);

    // "2024.01.15 14:30:25" or "2024-01-15 14:30"
    m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})[\sT](\d{2}):(\d{2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);

    // "2024.01.15" or "2024-01-15"
    m = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);

    // "20240115143025" (14자리)
    m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);

    // "20240115" (8자리)
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);

    // Excel 시리얼 날짜 (40000~60000 범위 = 2009~2064년)
    const serial = parseFloat(s.replace(/,/g, ''));
    if (!isNaN(serial) && serial > 40000 && serial < 60000) {
      // Excel epoch: 1899-12-30
      return new Date(Math.round((serial - 25569) * 86400 * 1000));
    }

    return null; // 파싱 불가 → null 반환 (잘못된 날짜 방지)
  }

  function monthKey(dt) {
    if (!dt || isNaN(dt)) return null;
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
  }

  function fmtWon(n) {
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }

  function fmtWonShort(n) {
    if (n >= 1e8) return (n/1e8).toFixed(1) + '억';
    if (n >= 1e4) return Math.round(n/1e4) + '만';
    return n.toLocaleString('ko-KR');
  }

  // =============================================================
  //  CSV 파서 — 헤더 자동감지 + 컬럼 동적 매핑
  // =============================================================
  function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n');

    // 1) 헤더 행 자동탐색 (최대 30행 스캔)
    let headerIdx = 0;
    const COL_KEYWORDS = ['거래일시','출금','입금','거래내용'];
    for (let i = 0; i < Math.min(30, lines.length); i++) {
      const line = lines[i];
      if (!line.trim()) continue;
      const matchCount = COL_KEYWORDS.filter(kw => line.includes(kw)).length;
      if (matchCount >= 2) { headerIdx = i; break; }
    }

    // 2) 헤더에서 컬럼 인덱스 동적 매핑
    const headerCols = splitCSVLine(lines[headerIdx]);
    const NAME_TO_KEY = {
      '거래일시':'DT', '거래 일시':'DT',
      '출금':'OUT', '출금금액':'OUT', '출금액':'OUT',
      '입금':'IN',  '입금금액':'IN',  '입금액':'IN',
      '거래후잔액':'BAL','거래후 잔액':'BAL','잔액':'BAL',
      '거래내용':'DESC','내용':'DESC','적요':'DESC',
      '상대계좌번호':'ACNO',
      '상대은행':'BANK',
      '메모':'MEMO',
      '거래구분':'TYPE',
      '수표어음금액':'CHK',
      'CMS코드':'CMS','cms코드':'CMS',
      '상대계좌예금주명':'NAME','예금주':'NAME',
    };
    headerCols.forEach((col, idx) => {
      const cleaned = col.trim().replace(/\s+/g,' ');
      const key = NAME_TO_KEY[cleaned];
      if (key && key in C) C[key] = idx;
    });

    // 3) 데이터 행 파싱
    const rows = [];
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const cols = splitCSVLine(line);
      // 컬럼 수가 너무 적은 합계행·빈 행 제외
      if (cols.length < Math.max(3, headerCols.length - 4)) continue;
      rows.push(cols);
    }

    console.log(`[대시보드] 헤더행: ${headerIdx}번째, 컬럼매핑:`, {...C});
    console.log(`[대시보드] 총 ${rows.length}건 로드, 샘플:`, rows[0]);
    return rows;
  }

  function splitCSVLine(line) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }

  // =============================================================
  //  거래 분류
  // =============================================================
  function classify(row) {
    const desc   = (row[C.DESC] || '').trim();
    const name   = (row[C.NAME] || '').trim();
    const inAmt  = parseAmount(row[C.IN]);
    const outAmt = parseAmount(row[C.OUT]);
    const dt     = parseDT(row[C.DT]);
    const hour   = dt ? dt.getHours() : -1;
    const dow    = dt ? dt.getDay() : -1; // 0=일 1=월 2=화 3=수 4=목 5=금 6=토
    const both   = desc + ' ' + name;

    // ── 예외: 가승인·취소 (입출금 양쪽 모두 체크) ────────────
    if (RE.CANCEL.test(desc) || RE.CANCEL.test(name)) {
      return { cat: 'excluded', label: '가승인·취소 제외' };
    }

    // ── 입금 ──────────────────────────────────────────────────
    if (inAmt > 0 && outAmt === 0) {
      // 카드매출 (카드사명+숫자, 숫자+카드사명 패턴 포함)
      if (RE.CARD_ANY.test(desc)) {
        const cardCo = identifyCardCompany(desc);
        return { cat: 'income', label: '카드매출', cardCo, amount: inAmt };
      }
      // 플랫폼 매출
      if (RE.PLATFORM.test(desc) || RE.PLATFORM.test(name)) {
        return { cat: 'income', label: '플랫폼매출', amount: inAmt };
      }
      // 이체매출 — 2~4글자 순수 한글 이름 = 현금매출
      if (RE.KR_NAME.test(desc) || RE.KR_NAME.test(name)) {
        return { cat: 'income', label: '이체매출(현금)', amount: inAmt };
      }
      return { cat: 'unclassified', amount: inAmt, dir: 'in' };
    }

    // ── 출금 ──────────────────────────────────────────────────
    if (outAmt > 0 && inAmt === 0) {
      // 고정비 (이진호 = 임대료/관리비/전기세 포함)
      if (RE.FIXED.test(both)) {
        return { cat: 'expense', label: '고정비', amount: outAmt };
      }
      // 인건비
      if (RE.SALARY.test(both)) {
        return { cat: 'expense', label: '인건비', amount: outAmt };
      }
      // 세금
      if (RE.TAX.test(both)) {
        return { cat: 'expense', label: '세금', amount: outAmt };
      }
      // 운영비
      if (RE.OPS.test(both)) {
        return { cat: 'expense', label: '운영비', amount: outAmt };
      }
      // 교통비
      if (RE.TRANS.test(both)) {
        return { cat: 'expense', label: '교통비', amount: outAmt };
      }
      // 통신비
      if (RE.TELECOM.test(both)) {
        return { cat: 'expense', label: '통신비', amount: outAmt };
      }
      // 식비 / 회식비 — 음식점 이름 키워드
      if (RE.FOOD.test(both)) {
        const label = (hour >= 22 || hour < 8) ? '회식비' : '식비';
        return { cat: 'expense', label, amount: outAmt };
      }
      // 식비 fallback — 수(3)목(4)금(5)토(6), 오후 5~7시, 10만원 미만
      const isFoodDay  = dow >= 3 && dow <= 6;
      const isFoodTime = hour >= 17 && hour < 19;
      if (isFoodDay && isFoodTime && outAmt < 100000) {
        return { cat: 'expense', label: '식비', amount: outAmt };
      }
      return { cat: 'unclassified', amount: outAmt, dir: 'out' };
    }

    return { cat: 'unclassified', dir: 'both' };
  }

  // =============================================================
  //  상태
  // =============================================================
  let allRows      = [];
  let chartMonthly = null;
  let chartPie     = null;

  // =============================================================
  //  데이터 로드
  // =============================================================
  async function loadData() {
    if (CSV_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL_HERE') {
      showError(
        'CSV URL이 아직 설정되지 않았습니다.\n\n' +
        'index.html 파일 상단의 CSV_URL 값을\n' +
        '구글 시트에서 복사한 URL로 교체해주세요.\n\n' +
        '(아래 안내 메시지를 참고하세요)'
      );
      return;
    }

    show('loading');
    hide('app');
    hide('error-screen');

    try {
      const url = CSV_URL.includes('?')
        ? CSV_URL + '&t=' + Date.now()
        : CSV_URL + '?t=' + Date.now();

      const res = await fetch(url);
      if (!res.ok) throw new Error(`서버 응답 오류: HTTP ${res.status}`);
      const text = await res.text();
      if (!text || text.length < 5) throw new Error('응답 데이터가 비어있습니다.');

      allRows = parseCSV(text);
      document.getElementById('last-updated').textContent =
        '🕐 마지막 업데이트: ' + new Date().toLocaleString('ko-KR');

      populateMonthFilter();
      renderDashboard();

      hide('loading');
      show('app');
    } catch(e) {
      showError(
        '데이터를 불러오지 못했습니다.\n\n' +
        '오류: ' + e.message + '\n\n' +
        '✅ 구글 시트가 "웹에 게시(CSV)" 되어 있는지 확인하세요.\n' +
        '✅ CSV_URL 값이 정확한지 확인하세요.'
      );
    }
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  function showError(msg) {
    hide('loading');
    hide('app');
    document.getElementById('error-message').textContent = msg;
    show('error-screen');
  }

  // =============================================================
  //  월 필터 채우기
  // =============================================================
  function populateMonthFilter() {
    const months = new Set();
    allRows.forEach(row => {
      const mk = monthKey(parseDT(row[C.DT]));
      if (mk) months.add(mk);
    });

    const sel = document.getElementById('month-filter');
    // 기존 옵션 제거 (전체 제외)
    while (sel.options.length > 1) sel.remove(1);

    const sorted = Array.from(months).sort().reverse();
    sorted.forEach(mk => {
      const [y, m] = mk.split('-');
      const opt = new Option(`${y}년 ${parseInt(m)}월`, mk);
      sel.add(opt);
    });

    // 기본값: 가장 최근 달
    if (sorted.length > 0) sel.value = sorted[0];
  }

  // =============================================================
  //  대시보드 렌더링
  // =============================================================
  function renderDashboard() {
    const selMonth = document.getElementById('month-filter').value;

    const tagged = allRows.map(row => ({
      row,
      dt  : parseDT(row[C.DT]),
      res : classify(row),
    }));

    // 월 필터
    const filtered = tagged.filter(item => {
      if (item.res.cat === 'excluded') return false;
      if (selMonth === 'all') return true;
      return monthKey(item.dt) === selMonth;
    });

    // 집계
    let totalIn  = 0, totalOut = 0;
    const inByLabel  = {};
    const outByLabel = {};
    const cardCoData = {};  // 카드사별 중분류
    const uncl       = [];

    filtered.forEach(({ res, row }) => {
      if (res.cat === 'income') {
        totalIn += res.amount;
        inByLabel[res.label]  = (inByLabel[res.label]  || 0) + res.amount;
        if (res.cardCo) {
          cardCoData[res.cardCo] = (cardCoData[res.cardCo] || 0) + res.amount;
        }
      } else if (res.cat === 'expense') {
        totalOut += res.amount;
        outByLabel[res.label] = (outByLabel[res.label] || 0) + res.amount;
      } else if (res.cat === 'unclassified') {
        uncl.push({ res, row });
      }
    });

    // 제외 건수
    const excludedCount = tagged.filter(i => i.res.cat === 'excluded').length;

    const net = totalIn - totalOut;
    const rate = totalIn > 0 ? (net / totalIn * 100).toFixed(1) : 0;

    // 카드 숫자
    document.getElementById('total-income').textContent   = fmtWon(totalIn);
    document.getElementById('total-expense').textContent  = fmtWon(totalOut);
    document.getElementById('net-profit').textContent     = fmtWon(net);
    document.getElementById('net-profit').className =
      'text-3xl font-bold mb-1 ' + (net >= 0 ? 'text-emerald-600' : 'text-red-500');
    document.getElementById('profit-rate').textContent    = `이익률 ${rate}%`;
    document.getElementById('excluded-note').textContent  =
      excludedCount > 0 ? `가승인·취소 ${excludedCount}건 제외됨` : '';

    // 세부 breakdown
    renderBreakdown('income-breakdown',  inByLabel,  'blue-600', { cardCoData });
    renderBreakdown('expense-breakdown', outByLabel, 'red-500');

    // 차트 (월별 바 차트는 항상 전체 기간)
    renderMonthlyChart(tagged);
    renderPieChart(outByLabel);

    // 미분류 테이블
    renderUnclassifiedTable(uncl);
  }

  function renderBreakdown(id, data, colorClass, opts = {}) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    const entries = Object.entries(data).sort((a,b) => b[1]-a[1]);
    if (entries.length === 0) {
      el.innerHTML = '<p class="text-xs text-gray-300">항목 없음</p>';
      return;
    }
    entries.forEach(([label, amt]) => {
      const div = document.createElement('div');
      div.className = 'flex justify-between items-center text-xs gap-2';
      div.innerHTML = `
        <span class="text-gray-500 truncate">${label}</span>
        <span class="font-semibold text-${colorClass} whitespace-nowrap">${fmtWon(amt)}</span>`;
      el.appendChild(div);

      // 카드매출이면 카드사별 중분류 서브 표시
      if (label === '카드매출' && opts.cardCoData && Object.keys(opts.cardCoData).length > 0) {
        const subs = Object.entries(opts.cardCoData).sort((a,b) => b[1]-a[1]);
        subs.forEach(([co, coAmt]) => {
          const subDiv = document.createElement('div');
          subDiv.className = 'flex justify-between items-center text-xs gap-2 pl-4';
          subDiv.innerHTML = `
            <span class="text-gray-400 truncate">└ ${co}</span>
            <span class="text-blue-400 whitespace-nowrap">${fmtWon(coAmt)}</span>`;
          el.appendChild(subDiv);
        });
      }
    });
  }

  // =============================================================
  //  월별 바 차트 (전체 기간)
  // =============================================================
  function renderMonthlyChart(tagged) {
    const data = {};
    tagged.forEach(({ res, dt }) => {
      if (res.cat === 'excluded') return;
      const mk = monthKey(dt);
      if (!mk) return;
      if (!data[mk]) data[mk] = { in: 0, out: 0 };
      if (res.cat === 'income')  data[mk].in  += res.amount;
      if (res.cat === 'expense') data[mk].out += res.amount;
    });

    const keys    = Object.keys(data).sort();
    const labels  = keys.map(k => { const [y,m] = k.split('-'); return `${y.slice(2)}.${m}`; });
    const inData  = keys.map(k => data[k].in);
    const outData = keys.map(k => data[k].out);

    const ctx = document.getElementById('monthly-chart').getContext('2d');
    if (chartMonthly) chartMonthly.destroy();
    chartMonthly = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: '매출',
            data: inData,
            backgroundColor: 'rgba(59,130,246,0.75)',
            borderRadius: 5,
            borderSkipped: false,
          },
          {
            label: '지출',
            data: outData,
            backgroundColor: 'rgba(239,68,68,0.65)',
            borderRadius: 5,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
        scales: {
          x: { grid: { display: false } },
          y: {
            ticks: { callback: v => fmtWonShort(v), font: { size: 11 } },
            grid: { color: 'rgba(0,0,0,0.05)' },
          },
        },
      },
    });
  }
