<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 가게 통합 손익 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .card-shine { background: linear-gradient(135deg, #ffffff 0%, #f8faff 100%); }
    .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- ── 로딩 화면 ── -->
  <div id="loading" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
    <div class="animate-spin rounded-full h-14 w-14 border-4 border-blue-500 border-t-transparent mb-4"></div>
    <p class="text-gray-500 text-sm">데이터를 불러오는 중입니다…</p>
  </div>

  <!-- ── 오류 화면 ── -->
  <div id="error-screen" class="hidden fixed inset-0 bg-white flex flex-col items-center justify-center z-50 p-8">
    <div class="text-5xl mb-4">⚠️</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">데이터 로드 실패</h2>
    <p id="error-message" class="text-gray-500 text-sm text-center max-w-md whitespace-pre-wrap mb-6"></p>
    <button onclick="location.reload()"
      class="bg-blue-600 text-white px-6 py-2 rounded-xl text-sm hover:bg-blue-700 transition-colors">
      다시 시도
    </button>
  </div>

  <!-- ── 메인 앱 ── -->
  <div id="app" class="hidden">

    <!-- 헤더 -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-20 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div>
          <h1 class="text-lg font-bold text-gray-900">🏪 우리 가게 통합 손익 대시보드</h1>
          <p id="last-updated" class="text-xs text-gray-400"></p>
        </div>
        <div class="flex items-center gap-2">
          <select id="month-filter"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="all">전체 기간</option>
          </select>
          <button onclick="loadData()"
            class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            새로고침
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

      <!-- ── 요약 카드 3개 ── -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <!-- 총 매출 -->
        <div class="stat-card card-shine rounded-2xl shadow-sm border border-blue-100 p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-medium text-gray-500">총 매출</span>
            <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">입금</span>
          </div>
          <p id="total-income" class="text-3xl font-bold text-blue-600 mb-3">—</p>
          <div id="income-breakdown" class="space-y-1.5 border-t border-blue-50 pt-3"></div>
        </div>

        <!-- 총 지출 -->
        <div class="stat-card card-shine rounded-2xl shadow-sm border border-red-100 p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-medium text-gray-500">총 지출</span>
            <span class="bg-red-100 text-red-600 text-xs font-semibold px-2.5 py-1 rounded-full">출금</span>
          </div>
          <p id="total-expense" class="text-3xl font-bold text-red-500 mb-3">—</p>
          <div id="expense-breakdown" class="space-y-1.5 border-t border-red-50 pt-3"></div>
        </div>

        <!-- 순이익 -->
        <div class="stat-card card-shine rounded-2xl shadow-sm border border-emerald-100 p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-medium text-gray-500">순이익</span>
            <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full">매출 − 지출</span>
          </div>
          <p id="net-profit" class="text-3xl font-bold text-emerald-600 mb-1">—</p>
          <p id="profit-rate" class="text-xs text-gray-400"></p>
          <p id="excluded-note" class="text-xs text-gray-400 mt-1"></p>
        </div>
      </div>

      <!-- ── 차트 2개 ── -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

        <!-- 월별 바 차트 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-700 mb-4">📊 월별 매출 / 지출 추이</h3>
          <div class="relative h-60 sm:h-72">
            <canvas id="monthly-chart"></canvas>
          </div>
        </div>

        <!-- 지출 파이 차트 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-700 mb-4">🥧 지출 항목별 비중</h3>
          <div class="relative h-60 sm:h-72">
            <canvas id="pie-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- ── 확인 필요 테이블 ── -->
      <div class="bg-white rounded-2xl shadow-sm border border-yellow-100">
        <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div>
            <h3 class="text-sm font-semibold text-gray-800">⚠️ 확인 필요 항목</h3>
            <p class="text-xs text-gray-400 mt-0.5">분류 규칙에 해당하지 않는 거래 내역입니다. 직접 확인해 주세요.</p>
          </div>
          <span id="unclassified-count"
            class="self-start sm:self-auto bg-yellow-100 text-yellow-700 text-xs font-bold px-3 py-1.5 rounded-full">0건</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
                <th class="text-left px-5 py-3 font-medium">거래일시</th>
                <th class="text-left px-5 py-3 font-medium">거래내용</th>
                <th class="text-right px-5 py-3 font-medium">출금</th>
                <th class="text-right px-5 py-3 font-medium">입금</th>
                <th class="text-left px-5 py-3 font-medium">상대방</th>
              </tr>
            </thead>
            <tbody id="unclassified-tbody" class="divide-y divide-gray-50">
              <tr>
                <td colspan="5" class="text-center py-10 text-gray-400 text-sm">
                  데이터를 불러오는 중입니다…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div><!-- /#app -->

  <script>
  // =============================================================
  //  ⚙️  설정 — 구글 시트 CSV URL을 여기에 붙여넣으세요
  //  예) 'https://docs.google.com/spreadsheets/d/.../pub?gid=0&single=true&output=csv'
  // =============================================================
  const CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJYO14r7y4-8SgUtFs7JWQKtL-Ijd6WP_wMPKiYGbs8r7utQ3AsJ0dgBeiROVIIw/pub?gid=680677374&single=true&output=csv';
  const PASSWORD = '1128';

  // =============================================================
  //  컬럼 인덱스 (통장 내역 기준)
  //  거래일시(0) 출금(1) 입금(2) 거래후잔액(3) 거래내용(4)
  //  상대계좌번호(5) 상대은행(6) 메모(7) 거래구분(8)
  //  수표어음금액(9) CMS코드(10) 상대계좌예금주명(11)
  // =============================================================
  const C = {
    DT   : 0,  // 거래일시
    OUT  : 1,  // 출금
    IN   : 2,  // 입금
    BAL  : 3,  // 거래후잔액
    DESC : 4,  // 거래내용
    ACNO : 5,  // 상대계좌번호
    BANK : 6,  // 상대은행
    MEMO : 7,  // 메모
    TYPE : 8,  // 거래구분
    CHK  : 9,  // 수표어음금액
    CMS  :10,  // CMS코드
    NAME :11,  // 상대계좌예금주명
  };

  // =============================================================
  //  분류 패턴
  // =============================================================
  const RE = {
    // 매출 — 카드사 키워드 (거래내용에서 탐지)
    CARD_CO   : /\bBC\b|우리카드|현대카드|SHC|신한카드|롯데카드|하나카드|삼성카드|KB카드|국민카드|농협카드|우체국카드/i,
    CARD_SHORT: /^(BC|SHC|우리|현대|신한|롯데|하나|삼성|KB|국민|농협)\s/,

    // 매출 — 플랫폼
    PLATFORM  : /Npay|네이버페이|네이버\s*파이낸셜|토스|Toss|카카오페이/i,

    // 매출 — 이체매출 (2~4글자 순수 한글 이름)
    KR_NAME   : /^[가-힣]{2,4}$/,

    // 지출 — 고정비
    FIXED     : /이진호/,

    // 지출 — 운영비
    OPS       : /쿠팡|오늘의집|GS25|CU편의점|회계법인|중앙피앤씨/,

    // 지출 — 교통비
    TRANS     : /택시|카카오T|카카오택시|우버|Uber/i,

    // 지출 — 배달앱 (시간대에 따라 식비/회식비)
    DELIVERY  : /우아한형제들|배달의민족|배민/,

    // 예외 — 가승인·취소
    CANCEL    : /가승인|취소/,
  };

  // =============================================================
  //  유틸리티
  // =============================================================
  function parseAmount(s) {
    if (!s) return 0;
    const n = parseFloat(s.replace(/[,\s]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function parseDT(s) {
    if (!s) return null;
    s = s.trim();
    // "2024.01.15 14:30:25" or "2024-01-15 14:30"
    let m = s.match(/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})[\s T](\d{2}):(\d{2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    // "20240115143025"
    m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    // fallback
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }

  function monthKey(dt) {
    if (!dt || isNaN(dt)) return null;
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
  }

  function fmtWon(n) {
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }

  function fmtWonShort(n) {
    if (n >= 1e8) return (n/1e8).toFixed(1) + '억';
    if (n >= 1e4) return (n/1e4).toFixed(0) + '만';
    return n.toLocaleString('ko-KR');
  }

  // =============================================================
  //  CSV 파서 (따옴표 처리 포함)
  // =============================================================
  function parseCSV(text) {
    const rows = [];
    const lines = text.replace(/\r/g, '').split('\n');
    for (let i = 1; i < lines.length; i++) {      // 헤더 행 제외
      const line = lines[i].trim();
      if (!line) continue;
      rows.push(splitCSVLine(line));
    }
    return rows;
  }

  function splitCSVLine(line) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }

  // =============================================================
  //  거래 분류
  // =============================================================
  function classify(row) {
    const desc   = (row[C.DESC] || '').trim();
    const name   = (row[C.NAME] || '').trim();
    const inAmt  = parseAmount(row[C.IN]);
    const outAmt = parseAmount(row[C.OUT]);
    const dt     = parseDT(row[C.DT]);
    const hour   = dt ? dt.getHours() : -1;
    const both   = desc + ' ' + name;

    // ── 예외: 가승인·취소 ──────────────────────────────────────
    if (RE.CANCEL.test(desc)) {
      return { cat: 'excluded', label: '가승인·취소 제외' };
    }

    // ── 입금 ──────────────────────────────────────────────────
    if (inAmt > 0 && outAmt === 0) {
      // 카드매출
      if (RE.CARD_CO.test(desc) || RE.CARD_SHORT.test(desc)) {
        return { cat: 'income', label: '카드매출', amount: inAmt };
      }
      // 플랫폼
      if (RE.PLATFORM.test(desc) || RE.PLATFORM.test(name)) {
        return { cat: 'income', label: '플랫폼매출', amount: inAmt };
      }
      // 이체매출 (2~4글자 순수 한글)
      if (RE.KR_NAME.test(desc) || RE.KR_NAME.test(name)) {
        return { cat: 'income', label: '이체매출', amount: inAmt };
      }
      // 미분류 입금
      return { cat: 'unclassified', amount: inAmt, dir: 'in' };
    }

    // ── 출금 ──────────────────────────────────────────────────
    if (outAmt > 0 && inAmt === 0) {
      // 고정비
      if (RE.FIXED.test(both)) {
        return { cat: 'expense', label: '고정비(임대료/관리비)', amount: outAmt };
      }
      // 운영비
      if (RE.OPS.test(both)) {
        return { cat: 'expense', label: '운영비', amount: outAmt };
      }
      // 교통비
      if (RE.TRANS.test(both)) {
        return { cat: 'expense', label: '교통비', amount: outAmt };
      }
      // 식비 / 회식비
      if (RE.DELIVERY.test(both)) {
        const label = (hour >= 22 || hour < 2) ? '회식비' : '식비';
        return { cat: 'expense', label, amount: outAmt };
      }
      // 미분류 출금
      return { cat: 'unclassified', amount: outAmt, dir: 'out' };
    }

    return { cat: 'unclassified', dir: 'both' };
  }

  // =============================================================
  //  상태
  // =============================================================
  let allRows      = [];
  let chartMonthly = null;
  let chartPie     = null;

  // =============================================================
  //  데이터 로드
  // =============================================================
  async function loadData() {
    if (CSV_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL_HERE') {
      showError(
        'CSV URL이 아직 설정되지 않았습니다.\n\n' +
        'index.html 파일 상단의 CSV_URL 값을\n' +
        '구글 시트에서 복사한 URL로 교체해주세요.\n\n' +
        '(아래 안내 메시지를 참고하세요)'
      );
      return;
    }

    show('loading');
    hide('app');
    hide('error-screen');

    try {
      const url = CSV_URL.includes('?')
        ? CSV_URL + '&t=' + Date.now()
        : CSV_URL + '?t=' + Date.now();

      const res = await fetch(url);
      if (!res.ok) throw new Error(`서버 응답 오류: HTTP ${res.status}`);
      const text = await res.text();
      if (!text || text.length < 5) throw new Error('응답 데이터가 비어있습니다.');

      allRows = parseCSV(text);
      document.getElementById('last-updated').textContent =
        '🕐 마지막 업데이트: ' + new Date().toLocaleString('ko-KR');

      populateMonthFilter();
      renderDashboard();

      hide('loading');
      show('app');
    } catch(e) {
      showError(
        '데이터를 불러오지 못했습니다.\n\n' +
        '오류: ' + e.message + '\n\n' +
        '✅ 구글 시트가 "웹에 게시(CSV)" 되어 있는지 확인하세요.\n' +
        '✅ CSV_URL 값이 정확한지 확인하세요.'
      );
    }
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  function showError(msg) {
    hide('loading');
    hide('app');
    document.getElementById('error-message').textContent = msg;
    show('error-screen');
  }

  // =============================================================
  //  월 필터 채우기
  // =============================================================
  function populateMonthFilter() {
    const months = new Set();
    allRows.forEach(row => {
      const mk = monthKey(parseDT(row[C.DT]));
      if (mk) months.add(mk);
    });

    const sel = document.getElementById('month-filter');
    // 기존 옵션 제거 (전체 제외)
    while (sel.options.length > 1) sel.remove(1);

    const sorted = Array.from(months).sort().reverse();
    sorted.forEach(mk => {
      const [y, m] = mk.split('-');
      const opt = new Option(`${y}년 ${parseInt(m)}월`, mk);
      sel.add(opt);
    });

    // 기본값: 가장 최근 달
    if (sorted.length > 0) sel.value = sorted[0];
  }

  // =============================================================
  //  대시보드 렌더링
  // =============================================================
  function renderDashboard() {
    const selMonth = document.getElementById('month-filter').value;

    const tagged = allRows.map(row => ({
      row,
      dt  : parseDT(row[C.DT]),
      res : classify(row),
    }));

    // 월 필터
    const filtered = tagged.filter(item => {
      if (item.res.cat === 'excluded') return false;
      if (selMonth === 'all') return true;
      return monthKey(item.dt) === selMonth;
    });

    // 집계
    let totalIn  = 0, totalOut = 0;
    const inByLabel  = {};
    const outByLabel = {};
    const uncl       = [];

    filtered.forEach(({ res, row }) => {
      if (res.cat === 'income') {
        totalIn += res.amount;
        inByLabel[res.label]  = (inByLabel[res.label]  || 0) + res.amount;
      } else if (res.cat === 'expense') {
        totalOut += res.amount;
        outByLabel[res.label] = (outByLabel[res.label] || 0) + res.amount;
      } else if (res.cat === 'unclassified') {
        uncl.push({ res, row });
      }
    });

    // 제외 건수
    const excludedCount = tagged.filter(i => i.res.cat === 'excluded').length;

    const net = totalIn - totalOut;
    const rate = totalIn > 0 ? (net / totalIn * 100).toFixed(1) : 0;

    // 카드 숫자
    document.getElementById('total-income').textContent   = fmtWon(totalIn);
    document.getElementById('total-expense').textContent  = fmtWon(totalOut);
    document.getElementById('net-profit').textContent     = fmtWon(net);
    document.getElementById('net-profit').className =
      'text-3xl font-bold mb-1 ' + (net >= 0 ? 'text-emerald-600' : 'text-red-500');
    document.getElementById('profit-rate').textContent    = `이익률 ${rate}%`;
    document.getElementById('excluded-note').textContent  =
      excludedCount > 0 ? `가승인·취소 ${excludedCount}건 제외됨` : '';

    // 세부 breakdown
    renderBreakdown('income-breakdown',  inByLabel,  'blue-600');
    renderBreakdown('expense-breakdown', outByLabel, 'red-500');

    // 차트 (월별 바 차트는 항상 전체 기간)
    renderMonthlyChart(tagged);
    renderPieChart(outByLabel);

    // 미분류 테이블
    renderUnclassifiedTable(uncl);
  }

  function renderBreakdown(id, data, colorClass) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    const entries = Object.entries(data).sort((a,b) => b[1]-a[1]);
    if (entries.length === 0) {
      el.innerHTML = '<p class="text-xs text-gray-300">항목 없음</p>';
      return;
    }
    entries.forEach(([label, amt]) => {
      const div = document.createElement('div');
      div.className = 'flex justify-between items-center text-xs gap-2';
      div.innerHTML = `
        <span class="text-gray-500 truncate">${label}</span>
        <span class="font-semibold text-${colorClass} whitespace-nowrap">${fmtWon(amt)}</span>`;
      el.appendChild(div);
    });
  }

  // =============================================================
  //  월별 바 차트 (전체 기간)
  // =============================================================
  function renderMonthlyChart(tagged) {
    const data = {};
    tagged.forEach(({ res, dt }) => {
      if (res.cat === 'excluded') return;
      const mk = monthKey(dt);
      if (!mk) return;
      if (!data[mk]) data[mk] = { in: 0, out: 0 };
      if (res.cat === 'income')  data[mk].in  += res.amount;
      if (res.cat === 'expense') data[mk].out += res.amount;
    });

    const keys    = Object.keys(data).sort();
    const labels  = keys.map(k => { const [y,m] = k.split('-'); return `${y.slice(2)}.${m}`; });
    const inData  = keys.map(k => data[k].in);
    const outData = keys.map(k => data[k].out);

    const ctx = document.getElementById('monthly-chart').getContext('2d');
    if (chartMonthly) chartMonthly.destroy();
    chartMonthly = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: '매출',
            data: inData,
            backgroundColor: 'rgba(59,130,246,0.75)',
            borderRadius: 5,
            borderSkipped: false,
          },
          {
            label: '지출',
            data: outData,
            backgroundColor: 'rgba(239,68,68,0.65)',
            borderRadius: 5,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
        scales: {
          x: { grid: { display: false } },
          y: {
            ticks: { callback: v => fmtWonShort(v), font: { size: 11 } },
            grid: { color: 'rgba(0,0,0,0.05)' },
          },
        },
      },
    });
  }

  // =============================================================
  //  지출 파이 차트
  // =============================================================
  function renderPieChart(outByLabel) {
    const ctx = document.getElementById('pie-chart').getContext('2d');
    if (chartPie) chartPie.destroy();

    const labels = Object.keys(outByLabel);
    const values = Object.values(outByLabel);
    const COLORS  = ['#3B82F6','#EF4444','#10B981','#F59E0B','#8B5CF6','#EC4899','#14B8A6','#F97316'];

    if (labels.length === 0) {
      // 데이터 없으면 빈 메시지
      chartPie = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: ['데이터 없음'], datasets: [{ data: [1], backgroundColor: ['#E5E7EB'] }] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } } },
      });
      return;
    }

    chartPie = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: COLORS.slice(0, labels.length),
          borderWidth: 2,
          borderColor: '#ffffff',
          hoverOffset: 8,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'right',
            labels: { boxWidth: 12, font: { size: 11 }, padding: 10 },
          },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.label}: ${fmtWon(ctx.parsed)}`,
            },
          },
        },
      },
    });
  }

  // =============================================================
  //  미분류 테이블
  // =============================================================
  function renderUnclassifiedTable(items) {
    document.getElementById('unclassified-count').textContent = `${items.length}건`;
    const tbody = document.getElementById('unclassified-tbody');

    if (items.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="text-center py-10 text-emerald-500 font-medium">
            ✅ 모든 항목이 분류되었습니다!
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = items.map(({ row }) => {
      const outAmt = parseAmount(row[C.OUT]);
      const inAmt  = parseAmount(row[C.IN]);
      return `
        <tr class="hover:bg-yellow-50 transition-colors">
          <td class="px-5 py-3 text-gray-500 text-xs whitespace-nowrap">${row[C.DT] || ''}</td>
          <td class="px-5 py-3 text-gray-800 font-medium">${row[C.DESC] || ''}</td>
          <td class="px-5 py-3 text-right text-xs ${outAmt ? 'text-red-500 font-semibold' : 'text-gray-300'}">
            ${outAmt ? fmtWon(outAmt) : '—'}
          </td>
          <td class="px-5 py-3 text-right text-xs ${inAmt ? 'text-blue-600 font-semibold' : 'text-gray-300'}">
            ${inAmt ? fmtWon(inAmt) : '—'}
          </td>
          <td class="px-5 py-3 text-gray-400 text-xs">${row[C.NAME] || ''}</td>
        </tr>`;
    }).join('');
  }

  // =============================================================
  //  이벤트
  // =============================================================
  document.getElementById('month-filter').addEventListener('change', renderDashboard);

  // =============================================================
  //  초기화
  // =============================================================
  window.addEventListener('DOMContentLoaded', () => {
    const pw = prompt('🔒 비밀번호를 입력하세요:');
    if (pw !== PASSWORD) {
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;
             font-family:sans-serif;color:#666;flex-direction:column;gap:12px;">
          <span style="font-size:48px">🔒</span>
          <p style="font-size:18px;font-weight:600;">접근 권한이 없습니다.</p>
          <button onclick="location.reload()"
            style="margin-top:8px;padding:8px 20px;background:#3B82F6;color:#fff;
                   border:none;border-radius:8px;cursor:pointer;font-size:14px;">
            다시 시도
          </button>
        </div>`;
      return;
    }
    loadData();
  });
  </script>

</body>
